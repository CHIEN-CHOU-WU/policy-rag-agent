[project]
name = "policy-rag"
version = "0.1.0"
description = "AI agent that answers questions about insurance policy documents with page-level citations."
authors = [
    { name = "John", email = "johnson12440@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.2.0",
    "chromadb>=1.5.9",
    "ollama>=0.6.3",
    "pymupdf>=2.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Emitted by PyMuPDF's SWIG bindings on import; not actionable here.
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
]
